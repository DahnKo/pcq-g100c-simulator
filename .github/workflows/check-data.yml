name: Validate exam JSON
on:
  push:
    paths: ['data/**', 'scripts/**', '.github/workflows/check-data.yml']
  pull_request:
    paths: ['data/**', 'scripts/**', '.github/workflows/check-data.yml']
jobs:
  check-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_exams.py
